name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain requirements
        run: echo 'Wasmtime 49 requires Rust 1.96 or later; building with the current stable toolchain.'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Prepare NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Verify native Android linker
        run: |
          # Check API 29 startup objects and Android/audio/log libraries before the Rust build.
          printf 'void muguet_link_test(void) {}\n' > "$RUNNER_TEMP/muguet-link-test.c"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" \
            -shared "$RUNNER_TEMP/muguet-link-test.c" -landroid -laaudio -llog \
            -o "$RUNNER_TEMP/libmuguet-link-test.so"
      - name: Build APK
        run: gradle -p android testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v5
        with:
          name: Muguet-Android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          echo '### Android build' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **Muguet-Android-arm64-debug** from this run’s Artifacts section and extract the APK.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Experimental ARM64 / Android 10+ / Vulkan. No game data is included. Device testing is still required.' >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Rust unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-tests
      - run: cargo test --lib
